{# Abas da área de Cadastros. `atual` = 'convenios', 'funcionarios', 'niveis', 'permissoes' ou 'lixeira' (esta só o administrador vê). #}
{% macro abas(atual) -%}
<div class="ferramentas">
  <div class="segmentado" role="group" aria-label="Cadastros">
    <a href="{{ url_for('lista_convenios') }}" class="{{ 'ativo' if atual == 'convenios' }}"><svg class="icone"><use href="#i-prancheta"/></svg>Convênios</a>
    <a href="{{ url_for('lista_funcionarios') }}" class="{{ 'ativo' if atual == 'funcionarios' }}"><svg class="icone"><use href="#i-usuarios"/></svg>Funcionários</a>
    <a href="{{ url_for('lista_niveis') }}" class="{{ 'ativo' if atual == 'niveis' }}"><svg class="icone"><use href="#i-cadeado"/></svg>Níveis de acesso</a>
    <a href="{{ url_for('lista_permissoes') }}" class="{{ 'ativo' if atual == 'permissoes' }}"><svg class="icone"><use href="#i-ok"/></svg>Permissões</a>
    {% if e_administrador %}<a href="{{ url_for('lixeira') }}" class="{{ 'ativo' if atual == 'lixeira' }}"><svg class="icone"><use href="#i-lixeira"/></svg>Lixeira</a>{% endif %}
  </div>
</div>
{%- endmacro %}
