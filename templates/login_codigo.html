{% extends "entrar_base.html" %}
{% block titulo %}Código de segurança — Casa de Acolhida Restauração{% endblock %}

{% block cartao %}
  <h1>Código de segurança</h1>
  {% if erro %}<p class="caixa-erros erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="{{ url_for('login_codigo') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Código do aplicativo autenticador (ou de recuperação)
      <input class="codigo" name="codigo" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="20" required autofocus></label>
    <button class="botao">Continuar</button>
  </form>
  <p class="links"><a href="{{ url_for('login') }}">Voltar para a entrada</a></p>
{% endblock %}
